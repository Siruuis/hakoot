name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Vérifie la version
        run: test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME#v}"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Archive
        run: |
          node scripts/release-notes.js "$GITHUB_REF_NAME" > notes.md
          mkdir -p release/hakoot
          cp -r dist server shared mcp package.json package-lock.json README.md LICENSE CHANGELOG.md .env.example .mcp.json release/hakoot/
          cp -r docs release/hakoot/docs
          cd release
          zip -qr "hakoot-$GITHUB_REF_NAME.zip" hakoot
          tar czf "hakoot-$GITHUB_REF_NAME.tar.gz" hakoot
      - name: Publie la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip release/*.tar.gz --title "Hakoot $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
